<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-app</title>
    <link rel="stylesheet" href="./weather.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input list="text" placeholder="Enter the city name"
            spellcheck="false">
          <datalist id="text">
                 <option value="Afghanistan">
                 <option value="Albania">
                 <option value=" Australia">
                 <option value="Bahrain">
                 <option value=" Bangladesh">
                 <option value=" Belgium">
                 <option value="Canada">
                 <option value="Chile">
                 <option value="China">
                 <option value="Colombia">
                 <option value="Denmark">
                 <option value="Delhi">
                 <option value="Bengaluru">
                 <option value="Kolkata">
                 <option value="Punjab">
                 <option value="India">
                 <option value="London">
                 <option value="Los Angeles">
                 <option value="Japan">
                 <option value="Hydrebad">
                 <option value="Mumbai">
                 <option value="Tamil Nadu">
                 <option value="Haryana">
                 <option value="New Delhi">
                 <option value="Gurugram">
                 <option value="Chandigarh">
                 <option value="Mohali">
                 <option value="Hawaii">
                 <option value="Meghalaya">
                 <option value="New York">



                 </option>
           </datalist>



            <button><img src="./search.png" alt=""></button>
        </div>
        <div class="error">
            <p>Invalid City Name</p>
        </div>
        <div class="weather">
            <img src="./heavy-rain.png" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h1>
            <div class="details">
                <div class="col">
                    <img src="./humidity.png" alt="">
                   <div>
                   <p class="humidity">50%</p>
                    <p>Humidity</p>
                  </div>
                </div>
             <div class="col">
                <img src="./wind.png" alt="">
             <div>
               <p class="wind">15 km/h</p>
               <p>Wind Speed</p>
             </div>
            </div>

        </div>
    </div>
    <script>
        const apiKey="639e523afacac926059eda23aca6dbee";
        const apiUrl="https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        const searchBox=document.querySelector(".search input");
        const searchBtn=document.querySelector(".search button");
        const weatherIcon=document.querySelector(".weather-icon");

        async function checkWeather(city){
            const response=await fetch(apiUrl+ city+`&appid=${apiKey}`);

            if(response.status==404){
                document.querySelector(".error").style.display="block";
                document.querySelector(".weather").style.display="none";
            }
            else{
             var data=await response.json();
             document.querySelector(".city").innerHTML=data.name;
             document.querySelector(".temp").innerHTML= Math.round(data.main.temp) +"°C";
             document.querySelector(".humidity").innerHTML=data.main.humidity+"%";
             document.querySelector(".wind").innerHTML=data.wind.speed+"km/h";

             if(data.weather[0].main=="Clouds"){
                weatherIcon.src="./clouds.png";
             }
             else if(data.weather[0].main=="Clear"){
                weatherIcon.src="./sun.png";
             }
             else if(data.weather[0].main=="Rain"){
                weatherIcon.src="./rainy-day.png";
             }
              else if(data.weather[0].main=="Drizzle"){
                weatherIcon.src="./drizzle.png";
             }
             else if(data.weather[0].main=="Mist"){
                weatherIcon.src="./haze.png";
             }

             document.querySelector(".weather").style.display="block";
             document.querySelector(".error").style.display="none";
            }




        }
        searchBtn.addEventListener("click",()=>{
        checkWeather(searchBox.value);

        })
        
        
    </script>
</body>
</html>
